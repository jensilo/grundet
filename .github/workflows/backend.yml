name: Backend

on:
  push:
    branches:
      - main
    paths:
      - "src/Grundet.Api/**"
      - "src/Grundet.Api.Tests/**"
      - "src/Grundet.AdminCli/**"
      - "src/Grundet.AdminCli.Tests/**"
      - "src/Directory.Build.props"
      - ".github/workflows/backend.yml"
  pull_request:
    branches:
      - main
    paths:
      - "src/Grundet.Api/**"
      - "src/Grundet.Api.Tests/**"
      - "src/Grundet.AdminCli/**"
      - "src/Grundet.AdminCli.Tests/**"
      - "src/Directory.Build.props"
      - ".github/workflows/backend.yml"

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'src/Directory.Build.props') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore
        run: |
          dotnet restore src/Grundet.Api/Grundet.Api.csproj
          dotnet restore src/Grundet.Api.Tests/Grundet.Api.Tests.csproj
          dotnet restore src/Grundet.AdminCli/Grundet.AdminCli.csproj
          dotnet restore src/Grundet.AdminCli.Tests/Grundet.AdminCli.Tests.csproj

      - name: Verify code formatting
        run: |
          dotnet format src/Grundet.Api --verify-no-changes --no-restore
          dotnet format src/Grundet.Api.Tests --verify-no-changes --no-restore
          dotnet format src/Grundet.AdminCli --verify-no-changes --no-restore
          dotnet format src/Grundet.AdminCli.Tests --verify-no-changes --no-restore

      - name: Build
        run: |
          dotnet build src/Grundet.Api.Tests --no-restore -c Release -warnaserror
          dotnet build src/Grundet.AdminCli.Tests --no-restore -c Release -warnaserror

      - name: Test
        run: |
          dotnet test src/Grundet.Api.Tests --no-build -c Release
          dotnet test src/Grundet.AdminCli.Tests --no-build -c Release
