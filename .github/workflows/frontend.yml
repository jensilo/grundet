name: Frontend

on:
  push:
    branches:
      - main
    paths:
      - "src/Grundet.Web/**"
      - ".github/workflows/frontend.yml"
  pull_request:
    branches:
      - main
    paths:
      - "src/Grundet.Web/**"
      - ".github/workflows/frontend.yml"

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: src/Grundet.Web/package.json

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: "pnpm"
          cache-dependency-path: src/Grundet.Web/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: src/Grundet.Web
        run: pnpm install --frozen-lockfile

      - name: Cache Next.js build
        uses: actions/cache@v6
        with:
          path: src/Grundet.Web/.next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('src/Grundet.Web/pnpm-lock.yaml') }}-${{ hashFiles('src/Grundet.Web/**/*.[jt]s', 'src/Grundet.Web/**/*.[jt]sx') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('src/Grundet.Web/pnpm-lock.yaml') }}-
            nextjs-${{ runner.os }}-

      - name: Type check
        working-directory: src/Grundet.Web
        run: pnpm exec tsc --noEmit

      - name: Check formatting
        working-directory: src/Grundet.Web
        run: pnpm exec prettier --check .

      - name: Lint
        working-directory: src/Grundet.Web
        run: pnpm exec eslint .

      - name: Test
        working-directory: src/Grundet.Web
        run: pnpm exec vitest run

      - name: Build
        working-directory: src/Grundet.Web
        run: pnpm exec next build
